; PlatformIO project for the CAPS-DASH ESP32-CAM nodes.
;
; ONE ENVIRONMENT PER PHYSICAL MODULE. The two boards are identical hardware
; running identical code; only the static IP and the camera code differ, and
; those must match the `cameras` rows the server holds:
;
;   pio run -e cam02 -t upload      ; -> 192.168.137.50, code "02"
;   pio run -e cam03 -t upload      ; -> 192.168.137.51, code "03"
;   pio device monitor              ; serial log (prints the IP it joined on)
;
; Editing the constants in the sketch between flashes instead is how a module
; ends up answering on its neighbour's address, which takes BOTH cameras
; offline and looks like a network fault rather than a flashing mistake. After
; flashing, `curl http://<ip>/status` reports `code` - check it before the
; board goes back on a ceiling.
;
; The Arduino IDE also builds this sketch, but it insists the folder be named
; after the .ino. PlatformIO does not, so the file stays where the repo wants
; it and `src_dir` points at this directory instead of the usual `src/`.
; Arduino IDE users get the cam02 defaults, which are compiled in as fallbacks.

[platformio]
src_dir = .
default_envs = cam02

[env]
platform = espressif32
board = esp32cam
framework = arduino

; The WS2812B status ring. Its ESP32 backend drives the strip from the RMT
; peripheral, which the camera does not touch (that one uses I2S0, LEDC
; channel 0 and timer 0), so the two coexist.
; Arduino IDE users: install "Adafruit NeoPixel" from the Library Manager.
lib_deps = adafruit/Adafruit NeoPixel@^1.12.3

; The `esp32cam` board definition already carries what this sketch needs -
; `huge_app.csv` partitions (the camera driver does not fit the default app
; partition) and `-DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue`. Do not
; restate them here; overriding is how the frame buffer ends up in internal
; RAM and VGA capture starts failing.

; The CH340 on the ESP32-CAM-MB shield. Windows renumbers it whenever the
; shield moves USB port (COM10 -> COM9 already), and a stale number fails as
; `Could not open COMxx, the port is busy or doesn't exist` - which reads like
; a dead board rather than a renamed port.
;
; Glob forms (`*CH340*`, `*1A86:7523*`) do NOT work in this PlatformIO version;
; they fail with `Please specify upload_port` even though `pio device list`
; shows the description and hwid. So the number is set explicitly here, and
; when it moves the quicker fix is the command line - editing this file
; invalidates the whole build and costs a four-minute recompile:
;
;   pio device list                                   # find the CH340
;   pio run -e cam03 -t upload --upload-port COM9
;
; Autodetection is not safe on this machine either: half a dozen Bluetooth
; serial ports and an Arduino UNO Q (VID:PID=2341:0078) are also on USB.
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200

[env:cam02]
build_flags = -DCAPS_STATIC_IP_LAST=50 -DCAPS_CAMERA_CODE='"02"'

[env:cam03]
build_flags = -DCAPS_STATIC_IP_LAST=51 -DCAPS_CAMERA_CODE='"03"'
