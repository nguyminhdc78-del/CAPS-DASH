name: Docker image

# Separate from ci.yml on purpose: an image build (especially cross-arch via
# QEMU) is slow and only worth paying for once a change has already merged or
# been tagged, not on every PR push.

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The deployment target is the Arduino UNO Q - aarch64 Linux (QRB2210).
      # GitHub's hosted runners are amd64, so an arm64 layer is cross-built
      # under QEMU emulation here; amd64 is built alongside it purely so a
      # developer on an x86 machine can `docker compose up` locally too. An
      # x86-only image would be useless on the actual board.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Buildx's own GHA cache backend - keyed on layer content, so an
          # unrelated doc-only change does not force a full onnxruntime/
          # opencv-headless rebuild.
          cache-from: type=gha
          cache-to: type=gha,mode=max
