[alembic]
script_location = backend/caps_dash/db/migrations
prepend_sys_path = backend
path_separator = os

# Timestamped, descriptive filenames. The default is a bare hash, which makes
# `ls versions/` useless for working out what happened when.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sqlalchemy.url is intentionally absent: env.py reads it from application
# settings so there is exactly one source of truth for the database location.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
